<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZIP & 파일 이름 일괄 정렬기</title>
  <!-- ZIP 처리를 위한 JSZip 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #fff; border-radius: 16px; padding: 32px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    h1 { font-size: 1.5rem; margin-bottom: 8px; text-align: center; color: #1d1d1f; }
    p.desc { font-size: 0.9rem; color: #86868b; text-align: center; margin-bottom: 24px; line-height: 1.4; }
    
    .config-box { background: #f0f0f5; padding: 16px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
    .config-box label { font-size: 0.95rem; font-weight: 600; }
    .config-box select { padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 0.95rem; }

    .drop-zone { border: 2px dashed #0071e3; border-radius: 12px; padding: 40px 20px; text-align: center; background: #fbfbfd; cursor: pointer; transition: all 0.2s ease; }
    .drop-zone:hover { background: #f0f7ff; }
    .drop-zone p { color: #0071e3; font-weight: 500; font-size: 0.95rem; line-height: 1.5; }
    
    #fileInput { display: none; }

    .status { margin-top: 20px; font-size: 0.9rem; text-align: center; color: #555; word-break: break-all; }
    
    button { width: 100%; margin-top: 20px; padding: 14px; background: #0071e3; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s ease; }
    button:hover { background: #0058b0; }
    button:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="card">
    <h1>ZIP / 파일 이름 정렬기</h1>
    <p class="desc">ZIP 압축 파일 또는 개별 파일들을 올리면<br>내부 숫자 이름을 001, 012 형태로 바꿔 드립니다.</p>

    <div class="config-box">
      <label for="digitSelect">자릿수 설정:</label>
      <select id="digitSelect">
        <option value="3" selected>3자리 (001, 012, 999)</option>
        <option value="4">4자리 (0001, 0012, 9999)</option>
        <option value="2">2자리 (01, 12, 99)</option>
      </select>
    </div>

    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <p id="dropText">ZIP 파일 또는 여러 파일을 클릭하거나<br>여기에 드래그하세요</p>
      <input type="file" id="fileInput" multiple accept=".zip, *">
    </div>

    <div class="status" id="statusText">선택된 파일이 없습니다.</div>

    <button id="downloadBtn" disabled>변환 및 ZIP 다운로드</button>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const statusText = document.getElementById('statusText');
    const downloadBtn = document.getElementById('downloadBtn');
    const digitSelect = document.getElementById('digitSelect');

    let selectedFiles = [];

    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.background = '#f0f7ff'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.background = '#fbfbfd'; });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.style.background = '#fbfbfd';
      handleFiles(e.dataTransfer.files);
    });

    function handleFiles(files) {
      selectedFiles = Array.from(files);
      if (selectedFiles.length === 1 && selectedFiles[0].name.toLowerCase().endsWith('.zip')) {
        statusText.innerText = `선택된 ZIP 파일: ${selectedFiles[0].name}`;
      } else if (selectedFiles.length > 0) {
        statusText.innerText = `${selectedFiles.length}개의 파일이 선택되었습니다.`;
      } else {
        statusText.innerText = "선택된 파일이 없습니다.";
      }
      downloadBtn.disabled = selectedFiles.length === 0;
    }

    // 수정된 핵심 정렬 함수
    function formatFileName(fullFilePath, targetDigits) {
      // 1. 슬래시(/) 및 백슬래시(\) 경로 구분자 통합 처리
      const normalizedPath = fullFilePath.replace(/\\/g, '/');
      const lastSlashIndex = normalizedPath.lastIndexOf('/');

      let folderPath = '';
      let fileName = normalizedPath;

      if (lastSlashIndex !== -1) {
        folderPath = normalizedPath.substring(0, lastSlashIndex + 1);
        fileName = normalizedPath.substring(lastSlashIndex + 1);
      }

      // 2. 확장자와 순수 파일명 분리
      const lastDotIndex = fileName.lastIndexOf('.');
      let nameWithoutExt = lastDotIndex !== -1 ? fileName.substring(0, lastDotIndex) : fileName;
      const ext = lastDotIndex !== -1 ? fileName.substring(lastDotIndex) : '';

      // 3. 순수 파일명이 숫자로만 되어있는지 정확히 확인 후 0 채우기 (padStart)
      if (/^\d+$/.test(nameWithoutExt.trim())) {
        nameWithoutExt = nameWithoutExt.trim().padStart(targetDigits, '0');
      }

      return `${folderPath}${nameWithoutExt}${ext}`;
    }

    downloadBtn.addEventListener('click', async () => {
      if (selectedFiles.length === 0) return;

      downloadBtn.disabled = true;
      const targetDigits = parseInt(digitSelect.value, 10);
      const outputZip = new JSZip();

      try {
        // 단일 ZIP 파일 처리
        if (selectedFiles.length === 1 && selectedFiles[0].name.toLowerCase().endsWith('.zip')) {
          statusText.innerText = "ZIP 파일을 해제 및 분석 중...";
          const uploadedZip = await JSZip.loadAsync(selectedFiles[0]);

          statusText.innerText = "파일 이름을 변경하며 다시 압축하는 중...";
          const filePromises = [];

          uploadedZip.forEach((relativePath, zipEntry) => {
            if (zipEntry.dir) return; // 폴더 자체는 제외

            const newPath = formatFileName(relativePath, targetDigits);
            const promise = zipEntry.async("blob").then(content => {
              outputZip.file(newPath, content);
            });
            filePromises.push(promise);
          });

          await Promise.all(filePromises);

        } else {
          // 개별 여러 파일들 처리
          statusText.innerText = "파일 변환 및 압축 중...";
          selectedFiles.forEach(file => {
            const newName = formatFileName(file.name, targetDigits);
            outputZip.file(newName, file);
          });
        }

        // 다운로드 파일 생성
        statusText.innerText = "최종 ZIP 파일 생성 중...";
        const content = await outputZip.generateAsync({ type: "blob" });
        
        const link = document.createElement("a");
        link.href = URL.createObjectURL(content);
        link.download = "renamed_files.zip";
        link.click();

        statusText.innerText = "변환 완료! renamed_files.zip 이 다운로드되었습니다.";
      } catch (err) {
        console.error(err);
        statusText.innerText = "오류가 발생했습니다. ZIP 파일 구조를 확인해주세요.";
      } finally {
        downloadBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
